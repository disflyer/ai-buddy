name: Kubernetes 应用部署

on:
  workflow_run:
    workflows: ["构建并推送容器镜像"]
    types: [completed]
  push:
    branches: [ dev, main ]
    paths: ['devops/kubernetes/**']
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options: [staging, prod]

env:
  APP_NAME: app-server
  CLUSTER_NAME: shared-app-cluster
  CLUSTER_LOCATION: us-central1-a
  DEPLOY_TIMEOUT: "10m"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    
    concurrency: 
      group: ${{ github.workflow }}-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'staging') }}
      cancel-in-progress: false
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置环境变量
      id: env
      run: |
        # 设置环境
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENVIRONMENT="${{ github.event.inputs.environment }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
        else
          ENVIRONMENT="staging"
        fi
        echo "ENVIRONMENT=${ENVIRONMENT}" >> $GITHUB_OUTPUT
        
        # 设置镜像信息
        PROJECT_ID=$(echo '${{ secrets.GCP_SA_KEY }}' | base64 -d | jq -r '.project_id')
        
        # 生成版本标签 - 使用提交哈希和时间戳组合
        IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)-$(date +%Y%m%d-%H%M%S)
        
        REGISTRY_PATH="us-central1-docker.pkg.dev/${PROJECT_ID}/app/${APP_NAME}:${IMAGE_TAG}"
        
        echo "PROJECT_ID=${PROJECT_ID}" >> $GITHUB_OUTPUT
        echo "REGISTRY_PATH=${REGISTRY_PATH}" >> $GITHUB_OUTPUT
        echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
    
    - name: 设置 Google Cloud 认证
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: 设置 Kubernetes 工具
      uses: yokawasa/action-setup-kube-tools@v0.9.3
      with:
        kubectl: '1.28.3'
        kustomize: '5.1.1'
    
    - name: 获取 GKE 凭证
      uses: google-github-actions/get-gke-credentials@v1
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location: ${{ env.CLUSTER_LOCATION }}
        project_id: ${{ steps.env.outputs.PROJECT_ID }}
    
    - name: 准备部署配置
      run: |
        # 创建 kustomization.yaml 的补丁
        cat > image-patch.yaml << EOF
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        images:
        - name: ${{ env.APP_NAME }}
          newName: us-central1-docker.pkg.dev/${{ steps.env.outputs.PROJECT_ID }}/app/${{ env.APP_NAME }}
          newTag: $(echo ${{ github.sha }} | cut -c1-7)
        EOF
    
    - name: 部署应用
      run: |
        # 确保命名空间存在
        kubectl create namespace ${{ steps.env.outputs.ENVIRONMENT }} --dry-run=client -o yaml | kubectl apply -f -
        
        # 切换到目标命名空间
        kubectl config set-context --current --namespace=${{ steps.env.outputs.ENVIRONMENT }}
        
        # 部署应用（使用正确的镜像更新方法）
        cd devops/kubernetes/overlays/${{ steps.env.outputs.ENVIRONMENT }}
        
        # 使用 kustomize edit 命令更新镜像信息
        kustomize edit set image ${{ env.APP_NAME }}=${{ steps.env.outputs.REGISTRY_PATH }}
        
        # 应用配置
        kubectl apply -k .
        
        # 等待部署完成
        kubectl rollout status deployment/${{ env.APP_NAME }} --timeout=${{ env.DEPLOY_TIMEOUT }}
    
    - name: 验证部署
      run: |
        # 检查 Pod 状态
        READY_PODS=$(kubectl get pods -l app=${{ env.APP_NAME }} -o jsonpath='{.items[*].status.containerStatuses[0].ready}' | tr ' ' '\n' | grep -c "true" || echo "0")
        TOTAL_PODS=$(kubectl get pods -l app=${{ env.APP_NAME }} --no-headers | wc -l)
        
        echo "Pod 状态: ${READY_PODS}/${TOTAL_PODS} 就绪"
        
        if [ "$READY_PODS" -eq 0 ]; then
          echo "错误: 部署验证失败"
          kubectl get pods -l app=${{ env.APP_NAME }}
          kubectl describe pods -l app=${{ env.APP_NAME }}
          exit 1
        fi
    
    - name: 部署报告
      if: always()
      run: |
        cat << EOF
        ==================== 部署报告 ====================
        状态: ${{ job.status }}
        环境: ${{ steps.env.outputs.ENVIRONMENT }}
        镜像: ${{ steps.env.outputs.REGISTRY_PATH }}
        版本标签: ${{ steps.env.outputs.IMAGE_TAG }}
        时间: $(date)
        提交: ${{ github.sha }}
        
        $(kubectl get pods -l app=${{ env.APP_NAME }} -o wide)
        
        上线策略: 滚动更新 (RollingUpdate)
        maxSurge: 1, maxUnavailable: 0
        =================================================
        EOF
        
        # 记录部署信息到文件
        echo "环境: ${{ steps.env.outputs.ENVIRONMENT }}" > deployment-info.txt
        echo "版本: ${{ steps.env.outputs.IMAGE_TAG }}" >> deployment-info.txt
        echo "时间: $(date)" >> deployment-info.txt