name: Kubernetes 应用部署

on:
  workflow_run:
    workflows: ["构建并推送容器镜像"]
    types:
      - completed
  push:
    branches: [ dev, main ]
    paths:
      - 'devops/kubernetes/**'  # 仅当 Kubernetes 配置变更时触发
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境 (staging/prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

# 环境变量配置
env:
  DEFAULT_REGISTRY_PREFIX: "us-central1-docker.pkg.dev"
  # 固定集群配置 - 不随环境变化
  CLUSTER_NAME: "shared-app-cluster"
  CLUSTER_LOCATION: "us-central1-a"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    
    # 并发控制
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'staging') }}
      cancel-in-progress: false
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: 设置环境变量
      id: env
      run: |
        # 设置部署环境
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENVIRONMENT="${{ github.event.inputs.environment }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
        else
          ENVIRONMENT="staging"
        fi
        echo "ENVIRONMENT=${ENVIRONMENT}" >> $GITHUB_ENV
        
        # 部署 ID 用于追踪和缓存无效化
        DEPLOY_ID="$(date +%Y%m%d-%H%M%S)"
        echo "DEPLOY_ID=${DEPLOY_ID}" >> $GITHUB_ENV
    
    - name: 设置 Google Cloud 认证和提取项目信息
      id: auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        create_credentials_file: true
        export_environment_variables: true
    
    - name: 提取 GCP 项目信息
      id: project
      run: |
        # 从服务账号密钥提取项目 ID
        echo "提取 GCP 项目信息..."
        PROJECT_ID=$(cat $GOOGLE_APPLICATION_CREDENTIALS | jq -r '.project_id')
        echo "PROJECT_ID=${PROJECT_ID}" >> $GITHUB_ENV
        echo "project_id=${PROJECT_ID}" >> $GITHUB_OUTPUT
        
        # 构建镜像仓库路径
        REGISTRY_PATH="${{ env.DEFAULT_REGISTRY_PREFIX }}/${PROJECT_ID}/app"
        echo "REGISTRY_PATH=${REGISTRY_PATH}" >> $GITHUB_ENV
    
    - name: 设置 Kubernetes 工具
      uses: yokawasa/action-setup-kube-tools@v0.9.3
      with:
        kubectl: '1.28.3'
        kustomize: '5.1.1'
        setup-tools: kubectl,kustomize
    
    - name: 获取 GKE 凭证
      id: get-credentials
      uses: google-github-actions/get-gke-credentials@v1
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location: ${{ env.CLUSTER_LOCATION }}
        project_id: ${{ env.PROJECT_ID }}
    
    - name: 准备并部署
      run: |
        echo "准备 ${{ env.ENVIRONMENT }} 环境的部署..."
        
        # 创建命名空间(如果不存在)
        kubectl get namespace ${{ env.ENVIRONMENT }} || kubectl create namespace ${{ env.ENVIRONMENT }}
        
        # 准备部署配置
        CONFIG_DIR="devops/kubernetes/overlays/${{ env.ENVIRONMENT }}"
        if [ ! -f "${CONFIG_DIR}/kustomization.yaml" ]; then
          echo "错误: 配置文件不存在 - ${CONFIG_DIR}/kustomization.yaml"
          exit 1
        fi
        
        # 创建工作目录并复制配置文件
        WORK_DIR=$(mktemp -d)
        mkdir -p ${WORK_DIR}/overlays/${{ env.ENVIRONMENT }}
        mkdir -p ${WORK_DIR}/base
        
        # 复制整个 Kubernetes 目录结构
        cp -r devops/kubernetes/base/* ${WORK_DIR}/base/
        cp -r devops/kubernetes/overlays/${{ env.ENVIRONMENT }}/* ${WORK_DIR}/overlays/${{ env.ENVIRONMENT }}/
        
        # 替换镜像路径
        sed -i "s|REGISTRY_PATH|${{ env.REGISTRY_PATH }}|g" ${WORK_DIR}/overlays/${{ env.ENVIRONMENT }}/kustomization.yaml
        
        # 查看 base 目录中的 deployment 名称，确保补丁正确
        DEPLOYMENT_NAME=$(grep -A1 "kind: Deployment" ${WORK_DIR}/base/deployment.yaml | grep "name:" | awk '{print $2}')
        echo "基础 Deployment 名称: ${DEPLOYMENT_NAME}"
        
        # 添加部署注解 - 使用正确的资源名称
        cat > ${WORK_DIR}/overlays/${{ env.ENVIRONMENT }}/deployment-patch.yaml << EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${DEPLOYMENT_NAME}
        spec:
          template:
            metadata:
              annotations:
                deploy.timestamp: "${{ env.DEPLOY_ID }}"
                deploy.github.actor: "${{ github.actor }}"
                deploy.github.sha: "${{ github.sha }}"
        EOF
        
        # 更新 kustomization 添加补丁
        echo "- deployment-patch.yaml" >> ${WORK_DIR}/overlays/${{ env.ENVIRONMENT }}/kustomization.yaml
        
        # 显示目录结构以便调试
        echo "显示工作目录结构:"
        find ${WORK_DIR} -type f | sort
        
        # 进入正确的目录执行 kustomize
        cd ${WORK_DIR}/overlays/${{ env.ENVIRONMENT }}
        
        # 在正确的目录中执行验证
        echo "执行部署前验证..."
        kustomize build . > manifest.yaml
        
        # 显示资源名称以帮助调试
        echo "部署资源名称:"
        grep -E "kind:|name:" manifest.yaml | grep -A1 "kind: Deployment" | grep "name:"
        
        kubectl apply --dry-run=client -f manifest.yaml
        
        # 执行部署
        echo "部署到 ${{ env.ENVIRONMENT }} 环境..."
        kubectl apply -f manifest.yaml
        
        # 部署名称会根据 kustomization 添加前缀
        FULL_DEPLOYMENT_NAME="${{ env.ENVIRONMENT }}-${DEPLOYMENT_NAME}"
        echo "完整部署名称: ${FULL_DEPLOYMENT_NAME}"
        
        # 验证部署
        echo "验证部署状态..."
        kubectl -n ${{ env.ENVIRONMENT }} rollout status deployment/${FULL_DEPLOYMENT_NAME} --timeout=300s
        
        # 检查 Pod 状态
        READY_PODS=$(kubectl -n ${{ env.ENVIRONMENT }} get pods -l app=${FULL_DEPLOYMENT_NAME} -o jsonpath='{.items[*].status.containerStatuses[0].ready}' | tr ' ' '\n' | grep -c "true" || echo "0")
        TOTAL_PODS=$(kubectl -n ${{ env.ENVIRONMENT }} get pods -l app=${FULL_DEPLOYMENT_NAME} --no-headers | wc -l)
        
        echo "就绪 Pod 数量: ${READY_PODS}/${TOTAL_PODS}"
        if [ "$READY_PODS" -eq 0 ]; then
          echo "错误: 未找到就绪的 Pod"
          kubectl -n ${{ env.ENVIRONMENT }} get pods -l app=${FULL_DEPLOYMENT_NAME}
          kubectl -n ${{ env.ENVIRONMENT }} describe pods -l app=${FULL_DEPLOYMENT_NAME}
          exit 1
        fi
        
        echo "部署成功完成"
    
    - name: 部署报告
      if: always()
      run: |
        echo "生成部署报告..."
        cat << EOF > deploy-report.txt
        部署状态: ${{ job.status }}
        部署环境: ${{ env.ENVIRONMENT }}
        部署ID: ${{ env.DEPLOY_ID }}
        部署时间: $(date)
        部署用户: ${{ github.actor }}
        提交SHA: ${{ github.sha }}
        镜像仓库: ${{ env.REGISTRY_PATH }}
        集群: ${{ env.CLUSTER_NAME }}
        EOF
        
        cat deploy-report.txt