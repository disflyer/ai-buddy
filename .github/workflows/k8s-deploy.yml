name: Kubernetes 应用部署

on:
  workflow_run:
    workflows: ["构建并推送容器镜像"]
    types:
      - completed
  push:
    branches: [ dev, main ]
    paths:
      - 'devops/kubernetes/**'  # 仅当 Kubernetes 配置变更时触发
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境 (staging/prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

# 环境变量配置
env:
  DEFAULT_REGISTRY_PREFIX: "us-central1-docker.pkg.dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    
    # 并发控制
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'staging') }}
      cancel-in-progress: false
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: 设置环境变量
      id: env
      run: |
        # 设置部署环境
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENVIRONMENT="${{ github.event.inputs.environment }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
        else
          ENVIRONMENT="staging"
        fi
        echo "ENVIRONMENT=${ENVIRONMENT}" >> $GITHUB_ENV
        
        # 部署 ID 用于追踪和缓存无效化
        DEPLOY_ID="$(date +%Y%m%d-%H%M%S)"
        echo "DEPLOY_ID=${DEPLOY_ID}" >> $GITHUB_ENV
    
    - name: 设置 Google Cloud 认证和提取项目信息
      id: auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        create_credentials_file: true
        export_environment_variables: true
    
    - name: 提取 GCP 项目信息
      id: project
      run: |
        # 从服务账号密钥提取项目 ID
        echo "提取 GCP 项目信息..."
        PROJECT_ID=$(cat $GOOGLE_APPLICATION_CREDENTIALS | jq -r '.project_id')
        echo "PROJECT_ID=${PROJECT_ID}" >> $GITHUB_ENV
        echo "project_id=${PROJECT_ID}" >> $GITHUB_OUTPUT
        
        # 通常集群名称可以根据环境推断
        CLUSTER_NAME="ai-buddy-cluster"
        echo "CLUSTER_NAME=${CLUSTER_NAME}" >> $GITHUB_ENV
        
        # 通常区域设置为 us-central1-a 或从服务账号区域确定
        CLUSTER_LOCATION="us-central1-a"
        echo "CLUSTER_LOCATION=${CLUSTER_LOCATION}" >> $GITHUB_ENV
        
        # 构建镜像仓库路径
        REGISTRY_PATH="${{ env.DEFAULT_REGISTRY_PREFIX }}/${PROJECT_ID}/app"
        echo "REGISTRY_PATH=${REGISTRY_PATH}" >> $GITHUB_ENV
    
    - name: 设置 Kubernetes 工具
      uses: yokawasa/action-setup-kube-tools@v0.9.3
      with:
        kubectl: '1.28.3'
        kustomize: '5.1.1'
        setup-tools: kubectl,kustomize
    
    - name: 获取 GKE 凭证
      id: get-credentials
      uses: google-github-actions/get-gke-credentials@v1
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location: ${{ env.CLUSTER_LOCATION }}
        project_id: ${{ env.PROJECT_ID }}
    
    - name: 准备并部署
      run: |
        echo "准备 ${{ env.ENVIRONMENT }} 环境的部署..."
        
        # 创建命名空间(如果不存在)
        kubectl get namespace ${{ env.ENVIRONMENT }} || kubectl create namespace ${{ env.ENVIRONMENT }}
        
        # 准备部署配置
        CONFIG_DIR="devops/kubernetes/overlays/${{ env.ENVIRONMENT }}"
        if [ ! -f "${CONFIG_DIR}/kustomization.yaml" ]; then
          echo "错误: 配置文件不存在 - ${CONFIG_DIR}/kustomization.yaml"
          exit 1
        fi
        
        # 创建工作目录
        WORK_DIR=$(mktemp -d)
        cp -r ${CONFIG_DIR}/* ${WORK_DIR}/
        
        # 替换镜像路径和添加部署注解
        sed -i "s|REGISTRY_PATH|${{ env.REGISTRY_PATH }}|g" ${WORK_DIR}/kustomization.yaml
        
        # 添加部署注解
        cat > ${WORK_DIR}/deployment-patch.yaml << EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${{ env.ENVIRONMENT }}-server
        spec:
          template:
            metadata:
              annotations:
                deploy.timestamp: "${{ env.DEPLOY_ID }}"
                deploy.github.actor: "${{ github.actor }}"
                deploy.github.sha: "${{ github.sha }}"
        EOF
        
        # 更新 kustomization
        echo "- deployment-patch.yaml" >> ${WORK_DIR}/kustomization.yaml
        
        # 部署前验证
        echo "执行部署前验证..."
        kubectl kustomize ${WORK_DIR} | kubectl apply --dry-run=client -f -
        
        # 执行部署
        echo "部署到 ${{ env.ENVIRONMENT }} 环境..."
        kubectl apply -k ${WORK_DIR}
        
        # 验证部署
        echo "验证部署状态..."
        kubectl -n ${{ env.ENVIRONMENT }} rollout status deployment/${{ env.ENVIRONMENT }}-server --timeout=300s
        
        # 检查 Pod 状态
        READY_PODS=$(kubectl -n ${{ env.ENVIRONMENT }} get pods -l app=${{ env.ENVIRONMENT }}-server -o jsonpath='{.items[*].status.containerStatuses[0].ready}' | tr ' ' '\n' | grep -c "true" || echo "0")
        TOTAL_PODS=$(kubectl -n ${{ env.ENVIRONMENT }} get pods -l app=${{ env.ENVIRONMENT }}-server --no-headers | wc -l)
        
        echo "就绪 Pod 数量: ${READY_PODS}/${TOTAL_PODS}"
        if [ "$READY_PODS" -eq 0 ]; then
          echo "错误: 未找到就绪的 Pod"
          kubectl -n ${{ env.ENVIRONMENT }} get pods -l app=${{ env.ENVIRONMENT }}-server
          kubectl -n ${{ env.ENVIRONMENT }} describe pods -l app=${{ env.ENVIRONMENT }}-server
          exit 1
        fi
        
        echo "部署成功完成"
    
    - name: 部署报告
      if: always()
      run: |
        echo "生成部署报告..."
        cat << EOF > deploy-report.txt
        部署状态: ${{ job.status }}
        部署环境: ${{ env.ENVIRONMENT }}
        部署ID: ${{ env.DEPLOY_ID }}
        部署时间: $(date)
        部署用户: ${{ github.actor }}
        提交SHA: ${{ github.sha }}
        镜像仓库: ${{ env.REGISTRY_PATH }}
        EOF
        
        cat deploy-report.txt