name: Kubernetes 应用部署

on:
  workflow_run:
    workflows: ["构建并推送容器镜像"]
    types:
      - completed
  push:
    branches: [ dev, main ]
    paths:
      - 'devops/kubernetes/**'  # 仅当 Kubernetes 配置变更时触发
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境 (staging/prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置 Google Cloud 认证
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        create_credentials_file: true
        
    - name: 安装 gcloud CLI
      uses: google-github-actions/setup-gcloud@v1
    
    - name: 设置环境
      id: env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "ENVIRONMENT=prod" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
        fi
        echo "使用环境: ${{ env.ENVIRONMENT }}"
        
    - name: 获取 GKE 凭证
      run: |
        # 使用 GitHub Secrets 中的配置
        PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
        REGION="${{ secrets.GCP_REGION }}"
        ZONE="${REGION}-a"
        CLUSTER_NAME="${{ secrets.GKE_CLUSTER_NAME }}"
        REGISTRY_PATH="${{ secrets.GCP_REGISTRY_PATH }}"
        
        # 如果没有设置 REGISTRY_PATH，则构建默认值
        if [ -z "$REGISTRY_PATH" ]; then
          REGISTRY_PATH="gcr.io/${PROJECT_ID}/app"
        fi
        
        # 设置 Kubernetes 凭证和环境变量
        gcloud container clusters get-credentials ${CLUSTER_NAME} --zone ${ZONE} --project ${PROJECT_ID}
        echo "REGISTRY_PATH=${REGISTRY_PATH}" >> $GITHUB_ENV
        
    - name: 安装 kubectl 和 kustomize
      run: |
        curl -LO "https://dl.k8s.io/release/stable.txt"
        curl -LO "https://dl.k8s.io/$(cat stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
        
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/
        
    - name: 更新镜像路径
      run: |
        sed -i "s|REGISTRY_PATH|${{ env.REGISTRY_PATH }}|g" devops/kubernetes/overlays/${{ env.ENVIRONMENT }}/kustomization.yaml
        
    - name: 部署到 Kubernetes
      run: kubectl apply -k devops/kubernetes/overlays/${{ env.ENVIRONMENT }}/
      
    - name: 验证部署
      run: |
        kubectl -n ${{ env.ENVIRONMENT }} rollout status deployment/${{ env.ENVIRONMENT }}-server