name: Kubernetes 应用部署

on:
  workflow_run:
    workflows: ["构建并推送容器镜像"]
    types: [completed]
  push:
    branches: [ dev, main ]
    paths: ['devops/kubernetes/**']
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options: [staging, prod]

env:
  APP_NAME: app-server
  CLUSTER_NAME: shared-app-cluster
  CLUSTER_LOCATION: us-central1-a
  DEPLOY_TIMEOUT: "10m"  # 增加部署超时时间

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 添加 job 超时时间
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    
    # 添加并发控制
    concurrency: 
      group: ${{ github.workflow }}-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'staging') }}
      cancel-in-progress: false
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置环境变量
      run: |
        # 设置环境
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENVIRONMENT="${{ github.event.inputs.environment }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
        else
          ENVIRONMENT="staging"
        fi
        
        if [[ -z "${ENVIRONMENT}" ]]; then
          echo "错误: 无法确定部署环境"
          exit 1
        fi
        echo "ENVIRONMENT=${ENVIRONMENT}" >> $GITHUB_ENV
        
        # 设置镜像信息
        if ! PROJECT_ID=$(echo '${{ secrets.GCP_SA_KEY }}' | base64 -d | jq -r '.project_id'); then
          echo "错误: 无法解析项目 ID"
          exit 1
        fi
        
        IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
        REGISTRY_PATH="us-central1-docker.pkg.dev/${PROJECT_ID}/app/${APP_NAME}:${IMAGE_TAG}"
        
        echo "PROJECT_ID=${PROJECT_ID}" >> $GITHUB_ENV
        echo "REGISTRY_PATH=${REGISTRY_PATH}" >> $GITHUB_ENV
    
    - name: 设置 Google Cloud 认证
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: 设置 Kubernetes 工具
      uses: yokawasa/action-setup-kube-tools@v0.9.3
      with:
        kubectl: '1.28.3'
        kustomize: '5.1.1'
    
    - name: 获取 GKE 凭证
      uses: google-github-actions/get-gke-credentials@v1
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location: ${{ env.CLUSTER_LOCATION }}
        project_id: ${{ env.PROJECT_ID }}
    
    - name: 部署应用
      run: |
        set -e  # 遇到错误立即退出
        
        echo "开始部署到 ${{ env.ENVIRONMENT }} 环境..."
        
        # 确保命名空间存在
        if ! kubectl create namespace ${{ env.ENVIRONMENT }} --dry-run=client -o yaml | kubectl apply -f -; then
          echo "错误: 无法创建或更新命名空间"
          exit 1
        fi
        
        # 切换到目标命名空间
        kubectl config set-context --current --namespace=${{ env.ENVIRONMENT }}
        
        # 保存当前版本用于回滚
        CURRENT_REVISION=$(kubectl get deployment ${{ env.APP_NAME }} -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "0")
        
        # 部署应用
        echo "使用镜像: ${{ env.REGISTRY_PATH }}"
        if ! kustomize build devops/kubernetes/overlays/${{ env.ENVIRONMENT }} \
          --load-restrictor LoadRestrictionsNone \
          --image ${{ env.APP_NAME }}=${{ env.REGISTRY_PATH }} | \
          kubectl apply -f -; then
          echo "错误: 部署失败"
          exit 1
        fi
        
        # 等待部署完成
        echo "等待部署完成..."
        if ! kubectl rollout status deployment/${{ env.APP_NAME }} --timeout=${{ env.DEPLOY_TIMEOUT }}; then
          echo "错误: 部署超时，开始回滚..."
          kubectl rollout undo deployment/${{ env.APP_NAME }} --to-revision=$CURRENT_REVISION
          exit 1
        fi
        
        # 验证部署状态
        echo "验证部署状态..."
        READY_PODS=$(kubectl get pods -l app=${{ env.APP_NAME }} -o jsonpath='{.items[*].status.containerStatuses[0].ready}' | tr ' ' '\n' | grep -c "true" || echo "0")
        if [ "$READY_PODS" -eq 0 ]; then
          echo "错误: 没有就绪的 Pod"
          kubectl get pods -l app=${{ env.APP_NAME }}
          kubectl describe pods -l app=${{ env.APP_NAME }}
          exit 1
        fi
        
        echo "部署成功完成"
    
    - name: 部署报告
      if: always()
      run: |
        echo "==================== 部署报告 ===================="
        echo "部署状态: ${{ job.status }}"
        echo "环境: ${{ env.ENVIRONMENT }}"
        echo "镜像: ${{ env.REGISTRY_PATH }}"
        echo "时间: $(date)"
        echo "提交: ${{ github.sha }}"
        
        if [[ "${{ job.status }}" == "failure" ]]; then
          echo "部署失败，请检查以上日志了解详细信息"
          kubectl get pods -l app=${{ env.APP_NAME }} || true
          kubectl describe pods -l app=${{ env.APP_NAME }} || true
        fi
        echo "================================================"