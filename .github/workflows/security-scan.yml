name: 基础设施安全扫描

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  schedule:
    - cron: '0 0 * * 0'  # 每周日运行
  workflow_dispatch: # 允许手动触发

jobs:
  terraform-scan:
    name: Terraform 安全扫描
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: tfsec 扫描
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: devops/terraform
        
    - name: 检查 terraform-docs
      uses: terraform-docs/gh-actions@v1.0.0
      with:
        working-dir: devops/terraform
        output-file: README.md
        output-method: inject
        git-push: "true"
        
  k8s-scan:
    name: Kubernetes 安全扫描
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: Kubesec 扫描
      uses: controlplaneio/kubesec-action@master
      with:
        input: devops/kubernetes/base/deployment.yaml
        format: json
        output: kubesec-results.json
        
    - name: 上传扫描结果
      uses: actions/upload-artifact@v3
      with:
        name: security-scan-results
        path: kubesec-results.json 