name: 基础设施安全扫描

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  schedule:
    - cron: '0 0 * * 0'  # 每周日运行
  workflow_dispatch: # 允许手动触发

jobs:
  terraform-scan:
    name: Terraform 安全扫描
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: tfsec 扫描
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: devops/terraform
        
    - name: 检查 terraform-docs
      uses: terraform-docs/gh-actions@v1.0.0
      with:
        working-dir: devops/terraform
        output-file: README.md
        output-method: inject
        git-push: "false"
        
  k8s-scan:
    name: Kubernetes 安全扫描
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 安装 kubesec
      run: |
        # 安装 kubesec CLI
        curl -sSL https://github.com/controlplaneio/kubesec/releases/download/v2.13.0/kubesec_linux_amd64.tar.gz | tar -xz
        chmod +x kubesec
        sudo mv kubesec /usr/local/bin/
        
    - name: 运行 Kubesec 扫描
      run: |
        mkdir -p results
        kubesec scan devops/kubernetes/base/deployment.yaml > results/kubesec-results.json
        
    - name: 显示扫描结果
      run: |
        cat results/kubesec-results.json | jq
        
    - name: 上传扫描结果
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results
        path: results/kubesec-results.json 