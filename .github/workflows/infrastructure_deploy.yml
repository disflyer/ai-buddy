name: 基础设施部署

on:
  workflow_dispatch:  # 手动触发
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
      components:
        description: '要部署的组件（逗号分隔：network,gke_cluster,secret_manager）'
        required: true
        default: 'network,gke_cluster,secret_manager'
        type: string
      import_existing:
        description: '是否导入现有资源'
        required: true
        default: true
        type: boolean

env:
  PROJECT_ID: rare-attic-453703-a8
  GKE_REGION: us-central1
  ENV_PROD: prod
  ENV_STAGING: staging
  NAMESPACE_PROD: production
  NAMESPACE_STAGING: staging
  
jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置环境变量
        run: |
          # 设置部署环境
          DEPLOY_ENV="${{ github.event.inputs.environment }}"
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_ENV
          
          # 根据环境设置命名空间
          if [[ "$DEPLOY_ENV" == "prod" ]]; then
            echo "NAMESPACE=production" >> $GITHUB_ENV
          else
            echo "NAMESPACE=staging" >> $GITHUB_ENV
          fi
          
          # 根据环境设置GKE集群名称
          echo "GKE_CLUSTER_NAME=ai-buddy-cluster" >> $GITHUB_ENV
          
          # 解析要部署的组件
          IFS=',' read -ra COMPONENTS <<< "${{ github.event.inputs.components }}"
          for comp in "${COMPONENTS[@]}"; do
            comp=$(echo $comp | tr -d ' ')
            echo "DEPLOY_${comp^^}=true" >> $GITHUB_ENV
          done
      
      - name: 设置Terraform和Terragrunt
        run: |
          # 安装Terraform
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install terraform=1.0.0
          
          # 安装Terragrunt
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.38.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
      
      - name: 设置Google Cloud身份验证
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true
          token_format: 'access_token'
          access_token_lifetime: '3600s'
      
      - name: 复制凭证文件
        run: |
          cp ${{ steps.auth.outputs.credentials_file_path }} devops/service-account.json
      
      - name: 设置Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: '>= 363.0.0'
          install_components: 'kubectl,gke-gcloud-auth-plugin'
      
      # 配置 Docker 认证
      - name: 配置 Docker 认证
        run: |
          echo "配置 Docker 认证..."
          # 配置 Artifact Registry
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          gcloud auth configure-docker gcr.io --quiet
          
          # 验证认证配置
          echo "验证 Docker 认证配置..."
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://gcr.io
      
      # 启用必要的API服务
      - name: 启用必要的API服务
        run: |
          echo "启用基础设施部署所需的API服务..."
          # 检查当前用户是否有权限启用服务
          if gcloud services list --available | grep compute.googleapis.com; then
            echo "正在尝试启用必要的API..."
            # 尝试启用所需API
            gcloud services enable compute.googleapis.com \
              servicenetworking.googleapis.com \
              cloudresourcemanager.googleapis.com \
              iam.googleapis.com \
              container.googleapis.com \
              serviceusage.googleapis.com || echo "警告：部分API可能需要手动在控制台启用"
          else
            echo "警告：当前服务账号可能没有权限启用API。如果后续部署失败，请手动在GCP控制台启用必要API。"
          fi

      # 导入现有资源
      - name: 导入现有资源
        if: ${{ github.event.inputs.import_existing == 'true' }}
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          ENV: ${{ env.DEPLOY_ENV }}
          REGION: ${{ env.GKE_REGION }}
        run: |
          echo "开始导入现有资源..."
          chmod +x devops/scripts/import_resources.sh
          ./devops/scripts/import_resources.sh || echo "警告：部分资源导入可能失败，这是正常的，继续执行..."
      
      # 部署网络
      - name: 部署网络
        if: env.DEPLOY_NETWORK == 'true'
        run: |
          echo "开始部署网络..."
          cd devops/environments/${{ env.DEPLOY_ENV }}/network
          terragrunt apply -auto-approve -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}" -lock=false
      
      # 部署GKE集群
      - name: 部署GKE集群
        if: env.DEPLOY_GKE_CLUSTER == 'true'
        run: |
          echo "开始部署GKE集群..."
          cd devops/environments/${{ env.DEPLOY_ENV }}/gke_cluster
          terragrunt apply -auto-approve -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}" -lock=false
      
      # 部署Secret Manager
      - name: 部署Secret Manager
        if: env.DEPLOY_SECRET_MANAGER == 'true'
        run: |
          echo "开始部署Secret Manager..."
          cd devops/environments/${{ env.DEPLOY_ENV }}/secret_manager
          terragrunt apply -auto-approve -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}" -lock=false
      
      # 创建命名空间
      - name: 创建命名空间
        if: env.DEPLOY_GKE_CLUSTER == 'true'
        run: |
          # 获取GKE集群凭证
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
            --region ${{ env.GKE_REGION }} \
            --project ${{ env.PROJECT_ID }}
          
          # 创建命名空间（如果不存在）
          kubectl create namespace ${{ env.NAMESPACE_PROD }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.NAMESPACE_PROD }} environment=${{ env.ENV_PROD }} --overwrite
          
          kubectl create namespace ${{ env.NAMESPACE_STAGING }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.NAMESPACE_STAGING }} environment=${{ env.ENV_STAGING }} --overwrite
      
      - name: 部署通知
        if: always()
        run: |
          echo "基础设施部署完成"
          echo "部署环境: ${{ env.DEPLOY_ENV }}"
          echo "部署组件: ${{ github.event.inputs.components }}" 