name: 基础设施部署

on:
  workflow_dispatch:  # 手动触发
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
      components:
        description: '要部署的组件（逗号分隔：network,gke_cluster,secret_manager）'
        required: true
        default: 'network,gke_cluster,secret_manager'
        type: string
      import_existing:
        description: '是否导入现有资源'
        required: true
        default: true
        type: boolean

env:
  PROJECT_ID: rare-attic-453703-a8
  GKE_REGION: us-central1
  ENV_PROD: prod
  ENV_STAGING: staging
  NAMESPACE_PROD: production
  NAMESPACE_STAGING: staging
  TF_VERSION: "1.5.7"  # 使用稳定版本
  TERRAGRUNT_VERSION: "0.45.0"  # 使用稳定版本
  
jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置环境变量
        run: |
          # 设置部署环境
          DEPLOY_ENV="${{ github.event.inputs.environment }}"
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_ENV
          
          # 根据环境设置命名空间
          if [[ "$DEPLOY_ENV" == "prod" ]]; then
            echo "NAMESPACE=production" >> $GITHUB_ENV
          else
            echo "NAMESPACE=staging" >> $GITHUB_ENV
          fi
          
          # 根据环境设置GKE集群名称
          echo "GKE_CLUSTER_NAME=ai-buddy-cluster" >> $GITHUB_ENV
          
          # 解析要部署的组件
          IFS=',' read -ra COMPONENTS <<< "${{ github.event.inputs.components }}"
          for comp in "${COMPONENTS[@]}"; do
            comp=$(echo $comp | tr -d ' ')
            echo "DEPLOY_${comp^^}=true" >> $GITHUB_ENV
          done
      
      - name: 设置Terraform和Terragrunt
        run: |
          echo "安装 Terraform ${{ env.TF_VERSION }}..."
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update
          sudo apt install terraform=${{ env.TF_VERSION }}* -y
          
          echo "安装 Terragrunt ${{ env.TERRAGRUNT_VERSION }}..."
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          
          # 验证安装
          terraform version
          terragrunt --version
      
      - name: 设置Google Cloud身份验证
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true
          token_format: 'access_token'
          access_token_lifetime: '3600s'
          cleanup_credentials: true
      
      - name: 复制凭证文件
        run: |
          cp ${{ steps.auth.outputs.credentials_file_path }} devops/service-account.json
          chmod 600 devops/service-account.json
      
      - name: 设置Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>=363.0.0'
          install_components: 'kubectl,gke-gcloud-auth-plugin,beta'
      
      - name: 启用必要的API服务
        run: |
          echo "启用基础设施部署所需的API服务..."
          
          # 定义需要启用的API列表
          REQUIRED_APIS=(
            "compute.googleapis.com"
            "container.googleapis.com"
            "servicenetworking.googleapis.com"
            "cloudresourcemanager.googleapis.com"
            "iam.googleapis.com"
            "serviceusage.googleapis.com"
            "secretmanager.googleapis.com"
            "artifactregistry.googleapis.com"
            "cloudbuild.googleapis.com"
            "cloudkms.googleapis.com"
          )
          
          # 检查并启用所需的API
          for api in "${REQUIRED_APIS[@]}"; do
            echo "正在检查 $api..."
            if ! gcloud services list --enabled --filter="name:$api" --format="get(name)" | grep -q "^$api$"; then
              echo "正在启用 $api..."
              gcloud services enable $api || {
                echo "警告：无法启用 $api，可能需要在控制台手动启用"
                continue
              }
            else
              echo "$api 已启用"
            fi
          done
      
      # 配置 Docker 认证
      - name: 配置 Docker 认证
        run: |
          echo "配置 Docker 认证..."
          # 配置 Artifact Registry
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          gcloud auth configure-docker gcr.io --quiet
          
          # 验证认证配置
          echo "验证 Docker 认证配置..."
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://gcr.io

      # 验证项目权限
      - name: 验证项目权限
        run: |
          echo "验证项目权限..."
          
          # 检查项目访问权限
          gcloud projects describe ${{ env.PROJECT_ID }} || {
            echo "错误：无法访问项目 ${{ env.PROJECT_ID }}"
            exit 1
          }
          
          # 检查服务账号权限
          gcloud iam service-accounts list || {
            echo "错误：无法列出服务账号"
            exit 1
          }

      # 导入现有资源
      - name: 导入现有资源
        if: ${{ github.event.inputs.import_existing == 'true' }}
        continue-on-error: true  # 允许导入失败继续执行
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          ENV: ${{ env.DEPLOY_ENV }}
          REGION: ${{ env.GKE_REGION }}
        run: |
          echo "开始导入现有资源..."
          chmod +x devops/scripts/import_resources.sh
          ./devops/scripts/import_resources.sh || echo "警告：部分资源导入可能失败，这是正常的，继续执行..."
      
      # 部署网络
      - name: 部署网络
        if: env.DEPLOY_NETWORK == 'true'
        run: |
          echo "开始部署网络..."
          cd devops/environments/${{ env.DEPLOY_ENV }}/network
          
          # 初始化 Terragrunt
          terragrunt init -upgrade || exit 1
          
          # 运行 plan 检查配置
          terragrunt plan -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}" || exit 1
          
          # 应用配置
          terragrunt apply -auto-approve -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}" || exit 1
      
      # 部署GKE集群
      - name: 部署GKE集群
        if: env.DEPLOY_GKE_CLUSTER == 'true'
        run: |
          echo "开始部署GKE集群..."
          cd devops/environments/${{ env.DEPLOY_ENV }}/gke_cluster
          
          # 初始化 Terragrunt
          terragrunt init -upgrade || exit 1
          
          # 运行 plan 检查配置
          terragrunt plan -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}" || exit 1
          
          # 应用配置
          terragrunt apply -auto-approve -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}" || exit 1
      
      # 部署Secret Manager
      - name: 部署Secret Manager
        if: env.DEPLOY_SECRET_MANAGER == 'true'
        run: |
          echo "开始部署Secret Manager..."
          cd devops/environments/${{ env.DEPLOY_ENV }}/secret_manager
          
          # 初始化 Terragrunt
          terragrunt init -upgrade || exit 1
          
          # 运行 plan 检查配置
          terragrunt plan -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}" || exit 1
          
          # 应用配置
          terragrunt apply -auto-approve -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}" || exit 1
      
      # 创建命名空间
      - name: 创建命名空间
        if: env.DEPLOY_GKE_CLUSTER == 'true'
        run: |
          echo "等待 GKE 集群就绪..."
          # 等待集群就绪
          for i in {1..30}; do
            if gcloud container clusters describe ${{ env.GKE_CLUSTER_NAME }} \
              --region ${{ env.GKE_REGION }} \
              --project ${{ env.PROJECT_ID }} \
              --format="get(status)" | grep -q "RUNNING"; then
              break
            fi
            echo "等待集群就绪... $i/30"
            sleep 10
          done
          
          # 获取GKE集群凭证
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
            --region ${{ env.GKE_REGION }} \
            --project ${{ env.PROJECT_ID }}
          
          # 创建命名空间（如果不存在）
          kubectl create namespace ${{ env.NAMESPACE_PROD }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.NAMESPACE_PROD }} environment=${{ env.ENV_PROD }} --overwrite
          
          kubectl create namespace ${{ env.NAMESPACE_STAGING }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.NAMESPACE_STAGING }} environment=${{ env.ENV_STAGING }} --overwrite
      
      - name: 部署通知
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "基础设施部署 $STATUS"
          echo "部署环境: ${{ env.DEPLOY_ENV }}"
          echo "部署组件: ${{ github.event.inputs.components }}"
          
          if [ "$STATUS" = "success" ]; then
            echo "✅ 部署成功完成"
          else
            echo "❌ 部署过程中出现错误"
          fi