name: 基础设施部署

on:
  workflow_dispatch:  # 手动触发
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      components:
        description: '要部署的组件（逗号分隔：network,gke_cluster,secret_manager）'
        required: true
        default: 'network,gke_cluster,secret_manager'
        type: string

env:
  PROJECT_ID: rare-attic-453703-a8
  GKE_REGION: us-central1
  GCR_HOST: us-central1-docker.pkg.dev
  TERRAFORM_SA_NAME: terraform-deployer
  CI_SA_NAME: github-actions-ci
  CONFIG_SECRET_NAME: .config.yaml
  JWT_SECRET_NAME: jwt-secret
  STORAGE_BUCKET_NAME: rare-attic-453703-a8-storage
  APP_NAME: app-server
  ENV_PROD: prod
  ENV_STAGING: staging
  ENV_DEV: dev
  NAMESPACE_PROD: production
  NAMESPACE_STAGING: staging
  NAMESPACE_DEV: development
  
jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置环境变量
        run: |
          # 设置部署环境
          DEPLOY_ENV="${{ github.event.inputs.environment }}"
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_ENV
          
          # 根据环境设置命名空间
          if [[ "$DEPLOY_ENV" == "prod" ]]; then
            echo "NAMESPACE=production" >> $GITHUB_ENV
          elif [[ "$DEPLOY_ENV" == "staging" ]]; then
            echo "NAMESPACE=staging" >> $GITHUB_ENV
          else
            echo "NAMESPACE=development" >> $GITHUB_ENV
          fi
          
          # 根据环境设置GKE集群名称
          echo "GKE_CLUSTER_NAME=${DEPLOY_ENV}-gke-cluster" >> $GITHUB_ENV
          
          # 解析要部署的组件
          IFS=',' read -ra COMPONENTS <<< "${{ github.event.inputs.components }}"
          for comp in "${COMPONENTS[@]}"; do
            comp=$(echo $comp | tr -d ' ')
            echo "DEPLOY_${comp^^}=true" >> $GITHUB_ENV
          done
      
      - name: 设置Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.0.0
      
      - name: 安装Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.38.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
      
      # 使用 google-github-actions/auth 进行身份验证
      - name: 设置Google Cloud身份验证
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true
      
      - name: 复制凭证文件
        run: |
          # 将凭证文件复制到 Terragrunt 期望的位置
          echo "复制凭证文件到 devops/service-account.json..."
          cp ${{ steps.auth.outputs.credentials_file_path }} devops/service-account.json
          echo "凭证文件已复制！"
      
      - name: 设置Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: '>= 363.0.0'
          install_components: 'kubectl,gke-gcloud-auth-plugin'
      
      - name: 验证Google Cloud身份验证
        run: |
          # 验证身份验证状态
          echo "当前认证账号:"
          gcloud auth list
          
          echo "当前配置:"
          gcloud config list
          
          # 确保项目已设置
          echo "设置当前项目为: ${{ env.PROJECT_ID }}"
          gcloud config set project ${{ env.PROJECT_ID }}
      
      # 修复所有 Terragrunt 配置
      - name: 修复所有 Terragrunt 配置
        run: |
          echo "修复所有 Terragrunt 配置..."
          
          # 创建修复脚本
          cat > fix_all_terragrunt_configs.sh << 'EOF'
          #!/bin/bash
          
          # 设置环境和组件
          ENVIRONMENTS=("dev" "staging" "prod")
          COMPONENTS=("network" "gke_cluster" "secret_manager" "app_server")
          
          # 显示当前工作目录
          echo "当前工作目录: $(pwd)"
          
          # 检查 devops 目录是否存在
          if [ ! -d "devops" ]; then
            echo "错误: devops 目录不存在"
            exit 1
          fi
          
          # 修复根目录的 terragrunt.hcl 文件
          ROOT_TERRAGRUNT="devops/terragrunt.hcl"
          if [ -f "$ROOT_TERRAGRUNT" ]; then
            echo "修复根目录的 terragrunt.hcl 文件..."
            
            # 备份原始文件
            cp "$ROOT_TERRAGRUNT" "${ROOT_TERRAGRUNT}.bak"
            
            # 添加禁用状态锁的配置
            if ! grep -q "lock = false" "$ROOT_TERRAGRUNT"; then
              sed -i 's/credentials = "${get_repo_root()}\/devops\/service-account.json"/credentials = "${get_repo_root()}\/devops\/service-account.json"\n    lock = false  # 禁用状态锁\n    skip_bucket_creation = true  # 跳过创建存储桶/g' "$ROOT_TERRAGRUNT"
              echo "已添加禁用状态锁的配置"
            else
              echo "已存在禁用状态锁的配置"
            fi
            
            echo "根目录的 terragrunt.hcl 文件修复完成"
          else
            echo "警告: 根目录的 terragrunt.hcl 文件不存在"
          fi
          
          # 遍历所有环境和组件
          for ENV in "${ENVIRONMENTS[@]}"; do
            for COMPONENT in "${COMPONENTS[@]}"; do
              MODULE_DIR="devops/environments/$ENV/$COMPONENT"
              
              # 检查目录是否存在
              if [ ! -d "$MODULE_DIR" ]; then
                echo "跳过: 目录 $MODULE_DIR 不存在"
                continue
              fi
              
              # 检查 terragrunt.hcl 文件是否存在
              if [ ! -f "$MODULE_DIR/terragrunt.hcl" ]; then
                echo "跳过: 文件 $MODULE_DIR/terragrunt.hcl 不存在"
                continue
              fi
              
              echo "修复 $ENV 环境的 $COMPONENT 组件配置..."
              
              # 备份原始文件
              cp "$MODULE_DIR/terragrunt.hcl" "$MODULE_DIR/terragrunt.hcl.bak"
              
              # 修复 include 路径 - 使用 Ubuntu 兼容的 sed 语法
              sed -i 's|path = "${get_repo_root()}/devops/terragrunt.hcl"|path = "../terragrunt.hcl"|g' "$MODULE_DIR/terragrunt.hcl"
              
              # 创建 .terragrunt-cache 目录（如果不存在）
              mkdir -p "$MODULE_DIR/.terragrunt-cache"
              
              # 创建 terragrunt_config.hcl 文件
              cat > "$MODULE_DIR/terragrunt_config.hcl" << EOFINNER
          # 禁用状态锁
          disable_init_lock = true
          
          # 启用重试机制
          retryable_errors = [
            "(?s).*Error acquiring the state lock.*",
            "(?s).*timeout while waiting for state to become unlocked.*",
            "(?s).*is already locked.*",
            "(?s).*TLS handshake timeout.*",
            "(?s).*connection reset by peer.*"
          ]
          
          retry_max_attempts = 5
          retry_sleep_interval_sec = 30
          EOFINNER
              
              echo "$ENV 环境的 $COMPONENT 组件配置修复完成"
            done
          done
          
          echo "所有 Terragrunt 配置修复完成！"
          exit 0
          EOF
          
          # 添加执行权限
          chmod +x fix_all_terragrunt_configs.sh
          
          # 执行修复脚本
          ./fix_all_terragrunt_configs.sh
          
          echo "所有 Terragrunt 配置修复完成！"
      
      # 检查并清理状态锁
      - name: 检查并清理状态锁
        run: |
          echo "检查并清理状态锁..."
          
          # 设置变量
          BUCKET_NAME="tfstate-rare-attic"
          COMPONENTS=("network" "gke_cluster" "secret_manager")
          
          for COMPONENT in "${COMPONENTS[@]}"; do
            LOCK_FILE="environments/${{ env.DEPLOY_ENV }}/$COMPONENT/default.tflock"
            
            echo "检查 ${{ env.DEPLOY_ENV }} 环境的 $COMPONENT 组件锁文件..."
            
            # 检查锁文件是否存在
            if gsutil -q stat gs://$BUCKET_NAME/$LOCK_FILE 2>/dev/null; then
              echo "锁文件存在，正在删除..."
              gsutil rm gs://$BUCKET_NAME/$LOCK_FILE
              echo "锁文件删除成功！"
            else
              echo "锁文件不存在或无法访问，继续执行。"
            fi
          done
      
      # 修复 Terragrunt 模块源路径
      - name: 修复 Terragrunt 模块源路径
        if: env.DEPLOY_NETWORK == 'true'
        run: |
          echo "修复 Terragrunt 模块源路径..."
          
          # 设置变量
          ENV="${{ env.DEPLOY_ENV }}"
          MODULE_DIR="devops/environments/$ENV/network"
          
          echo "修复 $ENV 环境的网络模块配置..."
          
          # 检查目录是否存在
          if [ ! -d "$MODULE_DIR" ]; then
            echo "错误: 目录 $MODULE_DIR 不存在"
            ls -la devops/environments/
            exit 1
          fi
          
          # 检查 terragrunt.hcl 文件是否存在
          if [ ! -f "$MODULE_DIR/terragrunt.hcl" ]; then
            echo "错误: 文件 $MODULE_DIR/terragrunt.hcl 不存在"
            ls -la "$MODULE_DIR"
            exit 1
          fi
          
          # 显示原始文件内容
          echo "原始 terragrunt.hcl 文件内容:"
          cat "$MODULE_DIR/terragrunt.hcl"
          
          # 备份原始文件
          cp "$MODULE_DIR/terragrunt.hcl" "$MODULE_DIR/terragrunt.hcl.bak"
          
          # 修复 include 路径 - 使用 Ubuntu 兼容的 sed 语法
          sed -i 's|path = "${get_repo_root()}/devops/terragrunt.hcl"|path = "../terragrunt.hcl"|g' "$MODULE_DIR/terragrunt.hcl"
          
          # 不修改双斜杠，保持 Terraform 模块引用的正确性
          
          # 显示修改后的文件内容
          echo "修改后的 terragrunt.hcl 文件内容:"
          cat "$MODULE_DIR/terragrunt.hcl"
          
          # 创建 .terragrunt-cache 目录（如果不存在）
          mkdir -p "$MODULE_DIR/.terragrunt-cache"
          
          # 在模块源目录中检查文件
          echo "检查模块源目录中的文件:"
          ls -la devops/modules/network/
          
          echo "Terragrunt 模块源路径修复完成！"
      
      # 部署网络
      - name: 部署网络
        if: env.DEPLOY_NETWORK == 'true'
        timeout-minutes: 15
        run: |
          echo "开始部署网络..."
          cd devops/environments/${{ env.DEPLOY_ENV }}/network
          
          # 显示当前目录结构
          echo "当前目录结构:"
          ls -la
          
          # 显示 terragrunt.hcl 文件内容
          echo "terragrunt.hcl 文件内容:"
          cat terragrunt.hcl
          
          # 显示 terragrunt_config.hcl 文件内容
          echo "terragrunt_config.hcl 文件内容:"
          cat terragrunt_config.hcl
          
          # 执行 Terragrunt 命令，添加详细日志
          echo "执行 terragrunt init..."
          TERRAGRUNT_LOG=debug TERRAGRUNT_CONFIG="terragrunt_config.hcl" terragrunt init
          
          # 检查模块源目录
          echo "检查模块源目录:"
          ls -la .terragrunt-cache || echo "terragrunt-cache 目录不存在"
          
          echo "执行 terragrunt apply..."
          TERRAGRUNT_LOG=debug TERRAGRUNT_CONFIG="terragrunt_config.hcl" terragrunt apply -auto-approve -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}" -lock=false
      
      # 部署GKE集群
      - name: 部署GKE集群
        if: env.DEPLOY_GKE_CLUSTER == 'true'
        timeout-minutes: 20
        run: |
          echo "开始部署GKE集群..."
          cd devops/environments/${{ env.DEPLOY_ENV }}/gke_cluster
          
          # 创建 terragrunt-cache 目录（如果不存在）
          mkdir -p .terragrunt-cache
          
          # 创建 Terragrunt 配置文件，启用重试机制
          cat > terragrunt_config.hcl << EOF
          # 启用重试机制
          retryable_errors = [
            "(?s).*Error acquiring the state lock.*",
            "(?s).*timeout while waiting for state to become unlocked.*",
            "(?s).*is already locked.*",
            "(?s).*TLS handshake timeout.*",
            "(?s).*connection reset by peer.*"
          ]
          
          retry_max_attempts = 5
          retry_sleep_interval_sec = 30
          EOF
          
          # 执行 Terragrunt 命令
          echo "执行 terragrunt init..."
          TERRAGRUNT_CONFIG="terragrunt_config.hcl" terragrunt init
          
          echo "执行 terragrunt apply..."
          TERRAGRUNT_CONFIG="terragrunt_config.hcl" terragrunt apply -auto-approve -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}"
      
      # 部署Secret Manager
      - name: 部署Secret Manager
        if: env.DEPLOY_SECRET_MANAGER == 'true'
        timeout-minutes: 10
        run: |
          echo "开始部署Secret Manager..."
          cd devops/environments/${{ env.DEPLOY_ENV }}/secret_manager
          
          # 创建 terragrunt-cache 目录（如果不存在）
          mkdir -p .terragrunt-cache
          
          # 创建 Terragrunt 配置文件，启用重试机制
          cat > terragrunt_config.hcl << EOF
          # 启用重试机制
          retryable_errors = [
            "(?s).*Error acquiring the state lock.*",
            "(?s).*timeout while waiting for state to become unlocked.*",
            "(?s).*is already locked.*",
            "(?s).*TLS handshake timeout.*",
            "(?s).*connection reset by peer.*"
          ]
          
          retry_max_attempts = 5
          retry_sleep_interval_sec = 30
          EOF
          
          # 执行 Terragrunt 命令
          echo "执行 terragrunt init..."
          TERRAGRUNT_CONFIG="terragrunt_config.hcl" terragrunt init
          
          echo "执行 terragrunt apply..."
          TERRAGRUNT_CONFIG="terragrunt_config.hcl" terragrunt apply -auto-approve -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}"
      
      # 创建命名空间
      - name: 创建命名空间
        if: env.DEPLOY_GKE_CLUSTER == 'true'
        run: |
          # 获取GKE集群凭证
          echo "获取GKE集群凭证..."
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
            --region ${{ env.GKE_REGION }} \
            --project ${{ env.PROJECT_ID }}
          
          # 创建命名空间（如果不存在）
          echo "创建生产环境命名空间 ${{ env.NAMESPACE_PROD }}..."
          kubectl create namespace ${{ env.NAMESPACE_PROD }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.NAMESPACE_PROD }} environment=${{ env.ENV_PROD }} --overwrite
          
          echo "创建预发布环境命名空间 ${{ env.NAMESPACE_STAGING }}..."
          kubectl create namespace ${{ env.NAMESPACE_STAGING }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.NAMESPACE_STAGING }} environment=${{ env.ENV_STAGING }} --overwrite
          
          echo "创建开发环境命名空间 ${{ env.NAMESPACE_DEV }}..."
          kubectl create namespace ${{ env.NAMESPACE_DEV }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.NAMESPACE_DEV }} environment=${{ env.ENV_DEV }} --overwrite
          
          echo "命名空间设置完成！"
      
      - name: 部署通知
        if: always()
        run: |
          # 获取部署结果
          if [[ $? -eq 0 ]]; then
            DEPLOY_STATUS="成功"
          else
            DEPLOY_STATUS="失败"
          fi
          
          echo "基础设施部署结果: $DEPLOY_STATUS"
          echo "部署环境: ${{ env.DEPLOY_ENV }}"
          echo "部署组件: ${{ github.event.inputs.components }}" 