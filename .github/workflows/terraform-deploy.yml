name: 基础设施部署

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'devops/terraform/**'  # 仅当 Terraform 配置变更时触发
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'devops/terraform/**'
  workflow_dispatch:  # 允许手动触发
    inputs:
      environment:
        description: '部署环境 (staging/prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
      auto_approve:
        description: '自动批准 Terraform 应用'
        type: boolean
        required: false
        default: false

env:
  TF_WORKING_DIR: devops/terraform/main

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置 Google Cloud 认证
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        create_credentials_file: true
        cleanup_credentials: false
        
    - name: 设置环境
      id: env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "ENVIRONMENT=prod" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
        fi
        echo "使用环境: ${{ env.ENVIRONMENT }}"
        
    - name: 设置 Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7
        
    - name: Terraform 初始化
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "使用凭证: $GOOGLE_APPLICATION_CREDENTIALS"
        # 确保 GCS 存储桶存在
        gcloud storage buckets describe gs://rare-attic-453703-a8-terraform-state --project=rare-attic-453703-a8 || \
        gcloud storage buckets create gs://rare-attic-453703-a8-terraform-state --project=rare-attic-453703-a8 --location=us-central1 --uniform-bucket-level-access
        
        # 增加 -reconfigure 参数以应用新的后端配置
        terraform init -reconfigure
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        
    - name: Terraform 格式检查
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform fmt -check || (echo "格式错误，自动修复中..." && terraform fmt && echo "已自动修复格式问题")
      
    - name: Terraform 验证
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform validate
      
    - name: Terraform 计划
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform plan -no-color -refresh=false
      
    - name: Terraform 应用
      working-directory: ${{ env.TF_WORKING_DIR }}
      if: |
        github.event_name == 'workflow_dispatch' && github.event.inputs.auto_approve == 'true' ||
        github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
      run: terraform apply -auto-approve -refresh=false -parallelism=1
