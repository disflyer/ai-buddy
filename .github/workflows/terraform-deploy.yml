name: 基础设施部署

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'devops/terraform/**'  # 仅当 Terraform 配置变更时触发
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'devops/terraform/**'
  workflow_dispatch:  # 允许手动触发
    inputs:
      environment:
        description: '部署环境 (staging/prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
      auto_approve:
        description: '自动批准 Terraform 应用'
        type: boolean
        required: false
        default: false

env:
  TF_WORKING_DIR: devops/terraform/main

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置 Google Cloud 认证
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        create_credentials_file: true
        cleanup_credentials: false
        
    - name: 设置环境
      id: env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "ENVIRONMENT=prod" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
        fi
        echo "使用环境: ${{ env.ENVIRONMENT }}"
        
    - name: 设置 Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7
        
    - name: Terraform 初始化
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "使用凭证: $GOOGLE_APPLICATION_CREDENTIALS"
        terraform init
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        
    - name: 导入现有资源（如果需要）
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        echo "检查是否需要导入资源..."
        # 尝试先移除可能存在的状态，再导入
        
        # 检查并导入服务账号
        if ! terraform state list | grep -q "module.infra.google_service_account.gke_node_sa"; then
          echo "导入服务账号资源..."
          terraform import module.infra.google_service_account.gke_node_sa projects/rare-attic-453703-a8/serviceAccounts/shared-gke-node-sa@rare-attic-453703-a8.iam.gserviceaccount.com || echo "导入失败或资源不存在"
        fi
        
        # 检查并导入 Artifact Registry
        if ! terraform state list | grep -q "module.infra.google_artifact_registry_repository.app_registry"; then
          echo "导入 Artifact Registry 资源..."
          terraform import module.infra.google_artifact_registry_repository.app_registry projects/rare-attic-453703-a8/locations/us-central1/repositories/shared-app-registry || echo "导入失败或资源不存在"
        fi
        
        # 检查并导入 GKE 集群 - 注意名称可能是 shared-shared-cluster 或 shared-app-cluster
        if ! terraform state list | grep -q "module.infra.google_container_cluster.primary"; then
          echo "尝试导入 GKE 集群资源 (shared-app-cluster)..."
          terraform import module.infra.google_container_cluster.primary projects/rare-attic-453703-a8/zones/us-central1-a/clusters/shared-app-cluster || echo "尝试备选名称..."
          
          if ! terraform state list | grep -q "module.infra.google_container_cluster.primary"; then
            echo "尝试导入 GKE 集群资源 (shared-shared-cluster)..."
            terraform import module.infra.google_container_cluster.primary projects/rare-attic-453703-a8/zones/us-central1-a/clusters/shared-shared-cluster || echo "导入失败或资源不存在"
          fi
        fi
        
        # 检查并导入节点池
        if ! terraform state list | grep -q "module.infra.google_container_node_pool.primary_nodes"; then
          CLUSTER_NAME=$(gcloud container clusters list --filter="name~shared" --format="value(name)" --limit=1)
          if [ -n "$CLUSTER_NAME" ]; then
            echo "导入节点池资源 ($CLUSTER_NAME)..."
            terraform import module.infra.google_container_node_pool.primary_nodes projects/rare-attic-453703-a8/zones/us-central1-a/clusters/$CLUSTER_NAME/nodePools/shared-pool || echo "导入失败或资源不存在"
          fi
        fi
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        
    - name: Terraform 格式检查
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform fmt -check || (echo "格式错误，自动修复中..." && terraform fmt && echo "已自动修复格式问题")
      
    - name: Terraform 验证
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform validate
      
    - name: Terraform 计划
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform plan -no-color -refresh=false
      
    - name: Terraform 应用
      working-directory: ${{ env.TF_WORKING_DIR }}
      if: |
        github.event_name == 'workflow_dispatch' && github.event.inputs.auto_approve == 'true' ||
        github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
      run: terraform apply -auto-approve -refresh=false -parallelism=1
