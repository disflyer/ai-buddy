name: 清理旧Docker镜像

on:
  schedule:
    # 每周一凌晨3点运行
    - cron: '0 3 * * 1'
  # 允许手动触发
  workflow_dispatch:

env:
  PROJECT_ID: rare-attic-453703-a8
  LOCATION: us-central1
  REPOSITORY: shared-app-registry
  PATH_PREFIX: ai-buddy/app-server
  KEEP_COUNT: 5

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Google Cloud认证
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        
    - name: 设置gcloud CLI
      uses: google-github-actions/setup-gcloud@v1
      
    - name: 清理旧镜像
      run: |
        echo "开始清理 ${PATH_PREFIX} 镜像，只保留最新的 ${KEEP_COUNT} 个版本..."
        
        # 获取所有镜像标签按时间排序（最新的在前面）
        ALL_TAGS=$(gcloud artifacts docker tags list ${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${PATH_PREFIX} \
          --format="value(tag)" --sort-by=~create_time --limit=999)
        
        # 将标签保存到数组中
        readarray -t TAGS_ARRAY <<< "$ALL_TAGS"
        
        # 显示找到的标签数量
        TOTAL_TAGS=${#TAGS_ARRAY[@]}
        echo "找到 ${TOTAL_TAGS} 个标签版本"
        
        # 计算要删除的标签
        if [ $TOTAL_TAGS -le $KEEP_COUNT ]; then
          echo "当前标签数量（${TOTAL_TAGS}）不超过保留数量（${KEEP_COUNT}），无需清理"
          exit 0
        fi
        
        # 显示要保留的标签
        echo "将保留以下最新的 ${KEEP_COUNT} 个标签:"
        for ((i=0; i<KEEP_COUNT && i<TOTAL_TAGS; i++)); do
          echo "- ${TAGS_ARRAY[$i]}"
        done
        
        # 删除旧标签
        echo "将删除以下较老的标签:"
        for ((i=KEEP_COUNT; i<TOTAL_TAGS; i++)); do
          TAG=${TAGS_ARRAY[$i]}
          echo "- 删除: ${TAG}"
          
          # 删除镜像
          gcloud artifacts docker images delete \
            ${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${PATH_PREFIX}:${TAG} \
            --quiet
        done
        
        echo "清理完成，保留了最新的 ${KEEP_COUNT} 个版本" 