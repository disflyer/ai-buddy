name: 构建并推送Docker镜像

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'server/**'
      - '.github/workflows/build-push.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
      
      - name: 认证到Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      
      - name: 设置Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: rare-attic-453703-a8
      
      - name: 配置Docker使用Artifact Registry
        run: |
          # 确保启用了Artifact Registry API
          gcloud services enable artifactregistry.googleapis.com
          
          # 配置Docker使用gcloud凭证
          gcloud auth configure-docker gcr.io --quiet
      
      - name: 构建并推送镜像
        run: |
          cd server
          # 使用短SHA作为版本标签
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          # 构建镜像
          docker build -t gcr.io/rare-attic-453703-a8/app-server:$SHORT_SHA .
          
          # 添加环境标签
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV_TAG="prod-latest"
          else
            ENV_TAG="staging-latest"
          fi
          
          # 标记镜像
          docker tag gcr.io/rare-attic-453703-a8/app-server:$SHORT_SHA gcr.io/rare-attic-453703-a8/app-server:$ENV_TAG
          
          # 推送镜像
          docker push gcr.io/rare-attic-453703-a8/app-server:$SHORT_SHA
          docker push gcr.io/rare-attic-453703-a8/app-server:$ENV_TAG