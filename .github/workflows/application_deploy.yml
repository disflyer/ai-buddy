name: 应用部署

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:  # 保留手动触发选项
    inputs:
      environment:
        description: '强制指定部署环境'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto  # 自动根据分支选择
          - staging
          - prod

env:
  PROJECT_ID: rare-attic-453703-a8
  GKE_REGION: us-central1
  GCR_HOST: us-central1-docker.pkg.dev
  APP_NAME: app-server
  ENV_PROD: prod
  ENV_STAGING: staging
  NAMESPACE_PROD: production
  NAMESPACE_STAGING: staging
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置环境变量
        run: |
          # 获取当前分支名
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "当前分支: $BRANCH_NAME"
          
          # 如果是手动触发且指定了非auto环境，则使用指定的环境
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" != "auto" ]]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
            echo "使用手动指定的环境: $DEPLOY_ENV"
          # 否则根据分支自动选择环境
          else
            # 根据分支设置部署环境
            if [[ "$BRANCH_NAME" == "master" ]]; then
              DEPLOY_ENV="prod"
              echo "检测到master分支，部署到生产环境"
            else
              DEPLOY_ENV="staging"
              echo "检测到非master分支，部署到预发布环境"
            fi
          fi
          
          # 设置环境变量供后续步骤使用
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_ENV
          
          # 根据环境设置命名空间
          if [[ "$DEPLOY_ENV" == "prod" ]]; then
            echo "NAMESPACE=production" >> $GITHUB_ENV
          else
            echo "NAMESPACE=staging" >> $GITHUB_ENV
          fi
          
          # 根据环境设置GKE集群名称
          echo "GKE_CLUSTER_NAME=${DEPLOY_ENV}-gke-cluster" >> $GITHUB_ENV
      
      - name: 设置Google Cloud身份验证
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.PROJECT_ID }}
      
      - name: 设置Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: '>= 363.0.0'
          install_components: 'kubectl,gke-gcloud-auth-plugin'
      
      - name: 构建并推送Docker镜像
        run: |
          # 设置镜像标签
          if [[ "${{ env.DEPLOY_ENV }}" == "prod" ]]; then
              IMAGE_TAG="prod-$(date +%Y%m%d-%H%M%S)"
          else
              IMAGE_TAG="staging-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          
          # 配置Docker
          gcloud auth configure-docker ${{ env.GCR_HOST }} --quiet
          
          # 构建镜像
          docker build -t ${{ env.GCR_HOST }}/${{ env.PROJECT_ID }}/gcr-us-central1/${{ env.APP_NAME }}:$IMAGE_TAG ./server
          
          # 推送镜像
          docker push ${{ env.GCR_HOST }}/${{ env.PROJECT_ID }}/gcr-us-central1/${{ env.APP_NAME }}:$IMAGE_TAG
          
          # 设置latest标签
          docker tag ${{ env.GCR_HOST }}/${{ env.PROJECT_ID }}/gcr-us-central1/${{ env.APP_NAME }}:$IMAGE_TAG ${{ env.GCR_HOST }}/${{ env.PROJECT_ID }}/gcr-us-central1/${{ env.APP_NAME }}:${{ env.DEPLOY_ENV }}-latest
          docker push ${{ env.GCR_HOST }}/${{ env.PROJECT_ID }}/gcr-us-central1/${{ env.APP_NAME }}:${{ env.DEPLOY_ENV }}-latest
      
      # 获取集群凭证
      - name: 获取集群凭证
        run: |
          # 检查GKE集群是否存在
          if ! gcloud container clusters describe ${{ env.GKE_CLUSTER_NAME }} --region ${{ env.GKE_REGION }} --project ${{ env.PROJECT_ID }} &> /dev/null; then
            echo "错误: GKE集群 ${{ env.GKE_CLUSTER_NAME }} 不存在，请先运行基础设施部署工作流"
            exit 1
          fi
          
          # 获取GKE集群凭证
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
            --region ${{ env.GKE_REGION }} \
            --project ${{ env.PROJECT_ID }}
      
      # 设置Terraform和Terragrunt
      - name: 设置Terraform和Terragrunt
        run: |
          # 安装Terraform
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install terraform=1.0.0
          
          # 安装Terragrunt
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.38.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
      
      # 部署应用
      - name: 部署应用服务
        run: |
          cd devops/environments/${{ env.DEPLOY_ENV }}/app_server
          terragrunt init
          terragrunt apply -auto-approve -var="env=${{ env.DEPLOY_ENV }}" -var="project_id=${{ env.PROJECT_ID }}" -var="image_tag=${{ env.IMAGE_TAG }}"
      
      - name: 验证部署
        run: |
          # 检查部署状态
          kubectl get deployments -n ${{ env.NAMESPACE }}
          
          # 获取服务IP
          SERVICE_IP=$(kubectl get service ${{ env.DEPLOY_ENV }}-${{ env.APP_NAME }}-lb -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "应用服务访问地址: $SERVICE_IP"
          
          echo "应用部署完成"
          echo "部署环境: ${{ env.DEPLOY_ENV }}"
          echo "命名空间: ${{ env.NAMESPACE }}"
          echo "镜像标签: ${{ env.IMAGE_TAG }}" 