name: 构建并推送容器镜像

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'server/**'  # 仅当服务器代码变更时触发
  workflow_dispatch:  # 允许手动触发
    inputs:
      tag:
        description: '镜像标签'
        required: false
        default: ''

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: rare-attic-453703-a8
  REPOSITORY: shared-app-registry
  IMAGE_NAME: ai-buddy/app-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置 Google Cloud 认证
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        create_credentials_file: true
        
    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: 登录到 Google Artifact Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: _json_key
        password: ${{ secrets.GCP_SA_KEY }}
        
    - name: 提取分支信息并设置标签
      id: tags
      run: |
        if [[ -n "${{ github.event.inputs.tag }}" ]]; then
          echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "TAG=stable" >> $GITHUB_ENV
        else
          echo "TAG=latest" >> $GITHUB_ENV
        fi
        echo "使用镜像标签: ${{ env.TAG }}"
        
    - name: 构建并推送镜像
      uses: docker/build-push-action@v4
      with:
        context: ./server  # 指向服务器代码目录
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
        
    - name: 镜像摘要
      run: |
        echo "镜像已推送: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
