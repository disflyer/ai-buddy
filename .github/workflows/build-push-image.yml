name: 构建并推送容器镜像

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'server/**'  # 仅当服务器代码变更时触发
  workflow_dispatch:  # 允许手动触发
    inputs:
      tag:
        description: '镜像标签'
        required: false
        default: ''

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: rare-attic-453703-a8
  REPOSITORY: shared-app-registry
  IMAGE_NAME: ai-buddy/app-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.IMAGE_TAG }}
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置 Google Cloud 认证
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        create_credentials_file: true
        
    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: 登录到 Google Artifact Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: _json_key
        password: ${{ secrets.GCP_SA_KEY }}
        
    - name: 提取分支信息并设置标签
      id: tags
      run: |
        if [[ -n "${{ github.event.inputs.tag }}" ]]; then
          # 如果手动指定了标签，则使用手动标签
          IMAGE_TAG="${{ github.event.inputs.tag }}"
        else
          # 使用提交ID作为标签（SHA的前7个字符）
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
        fi
        
        echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
        echo "TAG=${IMAGE_TAG}" >> $GITHUB_ENV
        echo "使用镜像标签: ${IMAGE_TAG}"
        
    - name: 构建并推送镜像
      uses: docker/build-push-action@v4
      with:
        context: ./server  # 指向服务器代码目录
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
        
    - name: 镜像摘要
      run: |
        echo "镜像已推送: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
