apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: websocket-server-network-policy
spec:
  podSelector:
    matchLabels:
      app: websocket-server
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0  # 允许访问所有外部IP
  # - {}  # 删除原来的空egress规则 