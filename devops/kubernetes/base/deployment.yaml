apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-server
  labels:
    app: websocket-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: websocket-server
      annotations:
        iam.gke.io/workload-identity-enabled: "true"
    spec:
      initContainers:
      - name: model-setup
        image: google/cloud-sdk:slim
        command:
        - bash
        - -c
        - |
          set -e
          echo "测试 Workload Identity 配置..."
          
          # 验证身份
          echo "验证身份信息..."
          gcloud auth list
          
          # 尝试访问 GCS
          echo "尝试列出 GCS 存储桶内容..."
          gsutil ls gs://ai-buddy-models/
          
          # 如果能够列出存储桶内容，说明 Workload Identity 配置正确
          # 然后执行模型同步
          MODEL_DIR="/app/models"
          DOWNLOADED_FLAG="$MODEL_DIR/.downloaded"
          
          # 创建目录
          mkdir -p $MODEL_DIR
          
          # 检查是否已同步模型
          if [ ! -f "$DOWNLOADED_FLAG" ]; then
            echo "从GCS同步模型到 ${MODEL_DIR}..."
            
            # 从GCS复制模型文件
            for model_dir in $(gsutil ls gs://ai-buddy-models/); do
              echo "同步目录: $model_dir"
              gsutil -m cp -r $model_dir $MODEL_DIR/
            done
            
            # 检查复制状态
            if [ $? -eq 0 ]; then
              touch $DOWNLOADED_FLAG
              echo "模型同步成功，已创建标记文件"
            else
              echo "模型同步失败"
              exit 1
            fi
          else
            echo "模型已存在，跳过同步"
          fi
        env:
        - name: MODEL_DIR
          value: /app/models
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 500Mi
      containers:
      - name: websocket-server
        image: websocket-server:latest
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 0
          requests:
            cpu: 500m
            memory: 1Gi
        envFrom:
        - configMapRef:
            name: app-config
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: model-storage 