apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-server
  labels:
    app: app-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: app-server
    spec:
      initContainers:
      - name: model-setup
        image: google/cloud-sdk:slim
        command:
        - bash
        - -c
        - |
          set -e  # 出错时退出
          
          echo "准备从GCS同步模型123..."
          
          # 定义变量
          MODEL_DIR="/app/models"
          DOWNLOADED_FLAG="$MODEL_DIR/.downloaded"
          GCS_MODEL_PATH="gs://ai-buddy-models"  # 替换为实际的bucket路径
          
          # 创建目录
          mkdir -p $MODEL_DIR
          # 检查是否已同步模型
          if [ ! -f "$DOWNLOADED_FLAG" ]; then
            for i in {1..30}; do
              gcloud auth list
              echo "尝试获取认证 ($i/30)..."
              if gcloud auth list 2>/dev/null | grep -q "service"; then
                echo "认证获取成功！"
                break
              fi
              sleep 5
            done
            echo "从GCS同步模型: ${GCS_MODEL_PATH} 到 ${MODEL_DIR}..."
            
            # 从GCS复制模型文件
            gsutil -m cp -r $GCS_MODEL_PATH/* $MODEL_DIR/
            
            # 检查复制状态
            if [ $? -eq 0 ]; then
              touch $DOWNLOADED_FLAG
              echo "模型同步成功，已创建标记文件"
            else
              echo "模型同步失败"
              exit 1
            fi
          else
            echo "模型已存在，跳过同步"
          fi
        env:
        - name: MODEL_DIR
          value: /app/models
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 500Mi
      containers:
      - name: app-server
        image: app-server:latest
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 0
          requests:
            cpu: 500m
            memory: 1Gi
        envFrom:
        - configMapRef:
            name: app-config
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12  # 允许应用最多有60秒启动时间(12 * 5s)
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: model-storage 