apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-server
  labels:
    app: app-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: app-server
    spec:
      initContainers:
      - name: model-downloader
        image: python:3.11-slim
        command:
        - bash
        - -c
        - |
          # 安装必要的库
          pip install huggingface_hub

          # 定义变量
          MODEL_DIR="/app/models"
          CACHE_DIR="/app/cache"
          DOWNLOADED_FLAG="$MODEL_DIR/.downloaded"
          MODEL_REVISION="${MODEL_REVISION:-}"

          # 创建目录
          mkdir -p $MODEL_DIR
          mkdir -p $CACHE_DIR

          # 检查是否已下载模型
          if [ ! -f "$DOWNLOADED_FLAG" ]; then
            echo "开始从 Hugging Face 下载 ${HUGGINGFACE_REPO_ID} 模型..."
            
            python -c "
          from huggingface_hub import snapshot_download
          import os

          # 准备下载参数
          download_args = {
              'repo_id': os.environ['HUGGINGFACE_REPO_ID'],
              'local_dir': os.environ['MODEL_DIR'],
              'cache_dir': os.environ['CACHE_DIR'],
          }

          # 如果指定了版本，添加 revision 参数
          if os.environ['MODEL_REVISION']:
              download_args['revision'] = os.environ['MODEL_REVISION']
              print(f'使用指定版本: {os.environ[\"MODEL_REVISION\"]}')
          else:
              print('使用最新版本')

          # 执行下载
          snapshot_download(**download_args)
            "
            
            touch $DOWNLOADED_FLAG
            echo "模型下载完成"
          else
            echo "模型已存在，跳过下载"
          fi
        env:
        - name: MODEL_DIR
          value: /app/models
        - name: CACHE_DIR
          value: /app/cache
        - name: MODEL_REVISION
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MODEL_REVISION
              optional: true
        - name: HUGGINGFACE_REPO_ID
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: HUGGINGFACE_REPO_ID
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 500Mi
      containers:
      - name: app-server
        image: app-server:latest
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 0
          requests:
            cpu: 500m
            memory: 1Gi
        envFrom:
        - configMapRef:
            name: app-config
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
      volumes:
      - name: models-volume
        emptyDir:
          sizeLimit: 5Gi 