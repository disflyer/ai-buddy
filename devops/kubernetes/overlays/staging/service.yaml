apiVersion: v1
kind: Service
metadata:
  name: websocket-server
  annotations:
    # WebSocket支持 - 与Ingress保持一致
    cloud.google.com/app-protocols: '{"websocket":"HTTP"}'
    # 后端配置，关联到我们的BackendConfig
    cloud.google.com/backend-config: '{"default":"staging-websocket-backend-config"}'
    # 启用WebSocket支持
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: websocket-server
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: websocket  # 这个名称必须与app-protocols注解中的键匹配
  type: ClusterIP 