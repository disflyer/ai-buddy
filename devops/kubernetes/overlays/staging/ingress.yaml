apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: websocket-server-ingress
  annotations:
    # GCP Ingress WebSocket支持配置
    kubernetes.io/ingress.allow-http: "true"
    # 启用后端配置，支持较长超时时间
    cloud.google.com/backend-config: '{"default": "websocket-backend-config"}'
    # 设置WebSocket代理配置
    cloud.google.com/app-protocols: '{"websocket":"HTTP"}'
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: websocket-server
            port:
              name: websocket
      # 为 /xiaozhi/v1/ 路径添加特定规则
      - path: /xiaozhi/v1/
        pathType: Prefix
        backend:
          service:
            name: websocket-server
            port:
              name: websocket 