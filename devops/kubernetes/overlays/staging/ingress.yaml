apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: websocket-server-ingress
  annotations:
    kubernetes.io/ingress.allow-http: "true"
    cloud.google.com/app-protocols: '{"websocket":"HTTP"}'
    cloud.google.com/neg: '{"ingress": true}'
    networking.gke.io/backend-config: |
      {
        "default": "staging-websocket-backend-config"
      }
    networking.gke.io/v1beta1.FrontendConfig: "staging-websocket-frontend-config"
    app.kubernetes.io/environment: staging
spec:
  ingressClassName: gce
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: websocket-server
            port:
              number: 80