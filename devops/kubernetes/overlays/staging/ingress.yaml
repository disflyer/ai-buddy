apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: websocket-server-ingress
  annotations:
    # 基本配置
    kubernetes.io/ingress.allow-http: "true"
    # 简化BackendConfig引用，确保与staging前缀匹配
    cloud.google.com/backend-config: '{"default": "staging-websocket-backend-config"}'
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: websocket-server
            port:
              name: websocket
      - path: /xiaozhi/v1/
        pathType: Prefix
        backend:
          service:
            name: websocket-server
            port:
              name: websocket 