apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  # 设备令牌
  DEVICE_TOKEN_1: "your-device-token-1"
  DEVICE_TOKEN_2: "your-device-token-2"
  
  # Memory API 密钥
  MEM0AI_API_KEY: "your-mem0ai-api-key"
  
  # 阿里云 LLM API 密钥
  ALI_LLM_API_KEY: "your-ali-llm-api-key"
  
  # 火山引擎 LLM API 密钥
  DOUBAO_LLM_API_KEY: "your-doubao-llm-api-key"
  
  # 火山引擎 ASR 服务
  DOUBAO_ASR_APPID: "your-doubao-asr-appid"
  DOUBAO_ASR_ACCESS_TOKEN: "your-doubao-asr-access-token"
  
  # 火山引擎 TTS 服务
  DOUBAO_TTS_APPID: "your-doubao-tts-appid"
  DOUBAO_TTS_ACCESS_TOKEN: "your-doubao-tts-access-token" 