apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-server
  labels:
    app: websocket-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-server
  template:
    metadata:
      labels:
        app: websocket-server
      annotations:
        iam.gke.io/workload-identity-enabled: "true"
    spec:
      serviceAccountName: app-server-sa
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      initContainers:
      - name: config-setup
        image: nginx:alpine
        command:
        - sh
        - -c
        - |
          echo "开始配置文件替换..."
          mkdir -p /app/data
          envsubst < /config/.config.yaml > /app/data/.config.yaml
          chmod 644 /app/data/.config.yaml
          echo "配置文件已复制到 /app/data/.config.yaml"
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 200Mi
        volumeMounts:
        - name: app-volume
          mountPath: /app
        - name: config-volume
          mountPath: /config
        envFrom:
        - secretRef:
            name: app-secrets
      - name: model-setup
        image: google/cloud-sdk:slim
        command:
        - bash
        - -c
        - |
          set -e
          echo "测试 Workload Identity 配置..."
          
          # 验证身份
          echo "验证身份信息..."
          gcloud auth list
          
          # 尝试访问 GCS
          echo "尝试列出 GCS 存储桶内容..."
          gsutil ls gs://ai-buddy-models/
          
          # 如果能够列出存储桶内容，说明 Workload Identity 配置正确
          # 然后执行模型同步
          MODEL_DIR="/app/models"
          DOWNLOADED_FLAG="$MODEL_DIR/.downloaded"
          MODELS_HASH_FILE="$MODEL_DIR/.models_hash"
          
          # 创建目录
          mkdir -p $MODEL_DIR
          
          # 获取远程模型的最新哈希值
          echo "获取远程模型的最新状态..."
          REMOTE_MODELS_LIST=$(gsutil ls -r gs://ai-buddy-models/ | sort)
          REMOTE_HASH=$(echo "$REMOTE_MODELS_LIST" | md5sum | cut -d ' ' -f 1)
          
          # 检查是否需要同步模型
          NEED_SYNC=false
          if [ ! -f "$DOWNLOADED_FLAG" ]; then
            echo "首次下载模型..."
            NEED_SYNC=true
          elif [ ! -f "$MODELS_HASH_FILE" ]; then
            echo "模型哈希文件不存在，需要重新同步..."
            NEED_SYNC=true
          else
            LOCAL_HASH=$(cat "$MODELS_HASH_FILE")
            if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
              echo "检测到模型更新，本地哈希: $LOCAL_HASH, 远程哈希: $REMOTE_HASH"
              NEED_SYNC=true
            else
              echo "模型已是最新版本，无需同步"
              # 打印models文件夹目录
              echo "models文件夹目录:"
              ls -R $MODEL_DIR
            fi
          fi
          
          # 如果需要同步，则执行同步操作
          if [ "$NEED_SYNC" = true ]; then
            echo "从GCS同步模型到 ${MODEL_DIR}..."
            
            # 从GCS复制模型文件
            for model_dir in $(gsutil ls gs://ai-buddy-models/); do
              echo "同步目录: $model_dir"
              gsutil -m cp -r $model_dir $MODEL_DIR/
            done
            
            # 检查复制状态
            if [ $? -eq 0 ]; then
              # 保存新的哈希值
              echo "$REMOTE_HASH" > "$MODELS_HASH_FILE"
              touch $DOWNLOADED_FLAG
              echo "模型同步成功，已更新哈希值"
            else
              echo "模型同步失败"
              exit 1
            fi
          else
            echo "模型已存在且是最新版本，跳过同步"
          fi
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
        resources:
          requests:
            cpu: 500m
            memory: 500Mi
          limits:
            cpu: 1
            memory: 1Gi
      containers:
      - name: websocket-server
        image: websocket-server:latest
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 0
          requests:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: model-storage
      - name: app-volume
        emptyDir: {}
      - name: config-volume
        configMap:
          name: staging-app-config