apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: websocket-backend-config
spec:
  # 配置健康检查
  healthCheck:
    checkIntervalSec: 15
    port: 8000
    requestPath: /health
    timeoutSec: 5
    type: HTTP
    healthyThreshold: 2
    unhealthyThreshold: 3
  # 配置会话亲和性，对于 WebSocket 连接很重要
  sessionAffinity:
    affinityType: GENERATED_COOKIE
  # 配置超时时间，WebSocket 需要较长的超时时间
  timeoutSec: 3600
  # 配置连接排空
  connectionDraining:
    drainingTimeoutSec: 60 