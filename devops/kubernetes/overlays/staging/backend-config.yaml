apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: websocket-backend-config
spec:
  # 配置健康检查
  healthCheck:
    type: TCP
    port: 80
    requestPath: /health
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
  # 配置会话亲和性
  sessionAffinity:
    affinityType: GENERATED_COOKIE
    affinityDurationSeconds: 3600
  # 配置超时时间
  timeoutSec: 3600
  # 配置连接排空
  connectionDraining:
    drainingTimeoutSec: 60 