apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging
namePrefix: staging-

commonLabels:
  app.kubernetes.io/environment: staging

resources:
- namespace.yaml
- pvc.yaml
- service-account.yaml
- websocket-server.yaml
- app-secrets.yaml
- configmap.yaml
- service.yaml
- network-policy.yaml
- gateway.yaml
- http-route.yaml

configMapGenerator:
- name: app-config
  behavior: merge
  literals:
  - APP_ENV=staging

secretGenerator:
- name: app-secrets
  behavior: merge
  literals:
  - APP_SECRET=staging-secret

patches:
- target:
    kind: Service
    name: websocket-server
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        cloud.google.com/app-protocols: '{"websocket":"HTTP"}'
        cloud.google.com/neg: '{"ingress":true}' 