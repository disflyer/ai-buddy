apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging
namePrefix: staging-

resources:
- ../../base

patches:
- path: configmap.yaml
  target:
    kind: ConfigMap
    name: app-config

images:
- name: app-server
  newName: REGISTRY_PATH/app-server
  newTag: latest

bases:
  - ../../base

patchesStrategicMerge:
  - deployment-annotations.yaml

commonAnnotations:
  # 这些注解会被添加到所有资源
  app.kubernetes.io/environment: staging 