apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging
namePrefix: staging-

resources:
- ../../base
- namespace.yaml
- pvc.yaml
- service-account.yaml
- websocket-server.yaml
- app-secrets.yaml

patches:
- path: configmap.yaml
  target:
    kind: ConfigMap
    name: app-config

commonAnnotations:
  # 这些注解会被添加到所有资源
  app.kubernetes.io/environment: staging 